name: Recommend (on demand)

# Runs a recommendation against the live auction house and prints it in the
# job log. Actions tab -> "Recommend (on demand)" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      prof:
        description: Profession (e.g. leatherworking)
        required: true
        default: leatherworking
      skill:
        description: Current skill
        required: true
        default: "1"
      target:
        description: Target skill
        required: true
        default: "75"
      house:
        description: "Auction house id (110 = US Alliance PvP, 111 = US Alliance Normal, 114 = US Horde Normal)"
        required: true
        default: "110"
      sources:
        description: "Recipe sources: t trainer, v vendor, d drop, q quest, c other, ? unknown, or all"
        required: true
        default: "tv?"
      items:
        description: "Optional: comma-separated item ids to list every live auction for"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Recommend
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          PROF: ${{ inputs.prof }}
          SKILL: ${{ inputs.skill }}
          TARGET: ${{ inputs.target }}
          HOUSE: ${{ inputs.house }}
          SOURCES: ${{ inputs.sources }}
          ITEMS: ${{ inputs.items }}
        run: |
          go build -o fsa .
          ./fsa prices -source blizzard -house "$HOUSE"
          ./fsa recommend -house "$HOUSE" -prof "$PROF" -skill "$SKILL" -target "$TARGET" -sources "$SOURCES" -top 15
          for id in ${ITEMS//,/ }; do
            echo
            echo "=== Item $id: every listing on house $HOUSE (copper per item, quantity) ==="
            jq -rs --argjson id "$id" '
              [.[] | .auctions[]? | select(.item.id == $id)
               | {p: (if (.unit_price // 0) > 0 then .unit_price else ((.buyout // 0) / (.quantity // 1)) end),
                  q: (.quantity // 1), bid: (.bid // 0), left: .time_left}]
              | sort_by(.p)
              | (if length == 0 then "no listings" else
                  "listings: \(length), units: \(map(.q) | add), cheapest: \(.[0].p), most expensive: \(.[-1].p)",
                  (.[] | "  \(.p | floor)c x\(.q)  bid \(.bid)  \(.left)") end)
            ' data/raw/auctions-us-$HOUSE.json data/raw/commodities-us-$HOUSE.json 2>/dev/null || echo "no data"
          done
