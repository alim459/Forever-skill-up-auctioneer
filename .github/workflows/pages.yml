name: Update AH prices and publish site

on:
  schedule:
    - cron: "17 * * * *" # hourly; Blizzard publishes a new snapshot about once an hour
  workflow_dispatch:
  push:
    branches: [main, claude/vibrant-noether-v377p3]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Fetch prices and build site
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          FOREVER_REGION: ${{ vars.FOREVER_REGION }}
          FOREVER_HOUSES: ${{ vars.FOREVER_HOUSES }}
        run: ./scripts/build-site.sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
