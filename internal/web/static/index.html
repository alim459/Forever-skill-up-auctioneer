<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Skill-Up Auctioneer</title>
<style>
:root{--bg:#14110d;--panel:#1e1a14;--line:#3a3226;--text:#eadfc8;--muted:#a3957c;--gold:#e3b341;--accent:#c9902c;
--orange:#ff8040;--yellow:#ffd23f;--green:#40bf40;--grey:#8a8a8a;--bad:#e06060;--good:#6fd06f}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:20px;color:var(--gold);letter-spacing:.3px}
h2{font-size:15px;margin:0 0 8px;color:var(--gold)}
main{max-width:1200px;margin:0 auto;padding:16px 20px 40px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:16px}
form{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input,select,button{font:inherit;color:var(--text);background:#0f0c09;border:1px solid var(--line);border-radius:6px;padding:7px 9px}
input[type=number]{width:90px}
button{background:var(--accent);color:#1a1208;border:0;font-weight:600;cursor:pointer}
button.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.6;cursor:wait}
.checks{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px}
.checks label{flex-direction:row;align-items:center;color:var(--text)}
.status{font-size:12px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
header .status{flex:1 1 280px}
main{overflow-x:hidden}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
td.num,th.num{text-align:right}
tr.click{cursor:pointer}tr.click:hover{background:#2a241b}
tr.detail td{background:#17130e;white-space:normal;color:var(--muted);font-size:13px}
.c-orange{color:var(--orange)}.c-yellow{color:var(--yellow)}.c-green{color:var(--green)}.c-grey{color:var(--grey)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.totals{display:flex;gap:24px;flex-wrap:wrap;margin:10px 0 0;font-size:13px}
.warn{color:var(--yellow);font-size:12px}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.err{color:var(--bad)}
.item{border-bottom:1px dotted var(--muted);cursor:help}
.tip{background:#070b1a;border:1px solid #5b6178;border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.4;color:#fff;min-width:200px;max-width:320px;white-space:normal}
.tip .l{display:flex;justify-content:space-between;gap:16px}
#tip{position:fixed;z-index:50;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.detail-wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;position:sticky;left:8px;max-width:calc(100vw - 90px)}
.detail-wrap>.hist{flex:1 1 100%}
.detail-wrap>div{flex:1 1 260px;min-width:0}
.detail-wrap>.tip{flex:0 1 300px}
.hist{position:relative;flex:1 1 100%;max-width:560px}
.hist h3{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 4px}
.hist svg{display:block;width:100%;height:140px;touch-action:pan-y}
.hist .htip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--text);white-space:nowrap}
.hist .empty{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.panel{min-width:0}
@media(min-width:1000px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
</style>
</head>
<body>
<header>
  <h1>⚒ Forever Skill-Up Auctioneer</h1>
  <div class="status" id="status">Loading…</div>
</header>
<main>
  <div class="panel">
    <form id="f">
      <label id="houseWrap" hidden>Auction house <select id="house"></select></label>
      <label>Profession <select id="prof"></select></label>
      <label>Current skill <input id="skill" type="number" min="1" max="300" value="1"></label>
      <label>Target skill <input id="target" type="number" min="1" max="300" value="75"></label>
      <div class="checks">
        <span class="status">Recipes from:</span>
        <label><input type="checkbox" data-src="t" checked> trainer</label>
        <label><input type="checkbox" data-src="v" checked> vendor</label>
        <label><input type="checkbox" data-src="d"> drop</label>
        <label><input type="checkbox" data-src="q"> quest</label>
        <label><input type="checkbox" data-src="ca"> other</label>
        <label><input type="checkbox" data-src="?" checked> unknown</label>
        <label><input type="checkbox" id="cooldowns"> cooldown crafts</label>
      </div>
      <button type="submit">Recommend</button>
      <button type="button" class="secondary" id="refresh">Refresh AH prices</button>
    </form>
  </div>

  <div id="out"></div>
</main>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function gold(c){
  const neg = c < 0; c = Math.round(Math.abs(c));
  const g = Math.floor(c/10000), s = Math.floor(c/100)%100, k = c%100;
  let out = (g? g+'g ':'') + ((g||s)? s+'s ':'') + k+'c';
  return (neg && c ? '-' : '') + out;
}
const signed = c => `<span class="${c>=0?'pos':'neg'}">${gold(c)}</span>`;
const pct = x => Math.round(x*100)+'%';
const ago = t => { const m = Math.round((Date.now()-new Date(t))/60000); return m<60? m+' min ago' : Math.round(m/60)+' h ago'; };

function save(){ try{ localStorage.setItem('fsa', JSON.stringify({prof:$('#prof').value, skill:$('#skill').value, target:$('#target').value, house:$('#house').value})); }catch(e){} }
function restore(){ try{ return JSON.parse(localStorage.getItem('fsa')||'{}'); }catch(e){ return {}; } }

// --- Hosted (static) mode: the Go advisor runs in the browser as WebAssembly,
// prices come from JSON files refreshed hourly by GitHub Actions.
const STATIC = !!window.FSA_STATIC;
const RECIPES_URL = window.FSA_RECIPES_URL || 'https://raw.githubusercontent.com/OrbitalBoom/Forever-Tracker/main/js/professions-data.js';
// Blizzard's API names each house's faction but doesn't say which ruleset a
// house serves (every ruleset lists all houses). Houses come in groups of three
// (Alliance, Horde, Blackwater). 114 = Normal Horde is community-confirmed; the
// four groups that have data are matched to the four rulesets in id order
// (1 PvP, 2 Normal, 3 Roleplay, 15 Roleplay PvP). 112/115/118 return no data.
const HOUSE_GROUPS = [
  {ruleset: 'PvP',          houses: {110: 'Alliance', 113: 'Horde', 116: 'Blackwater'}},
  {ruleset: 'Normal',       houses: {111: 'Alliance', 114: 'Horde', 117: 'Blackwater'}},
  {ruleset: 'Roleplay',     houses: {119: 'Alliance', 120: 'Horde', 121: 'Blackwater'}},
  {ruleset: 'Roleplay PvP', houses: {123: 'Alliance', 124: 'Horde', 125: 'Blackwater'}},
  {ruleset: 'Unused',       houses: {112: 'Alliance', 115: 'Horde', 118: 'Blackwater'}},
];
const DEFAULT_HOUSE = 110; // Alliance PvP
function houseInfo(h){
  const g = HOUSE_GROUPS.findIndex(g => h.house in g.houses);
  const faction = (h.name || '').replace(/ Auction House$/, '') || (g >= 0 ? HOUSE_GROUPS[g].houses[h.house] : 'House ' + h.house);
  return {order: g < 0 ? 99 : g, faction, ruleset: g < 0 ? '?' : HOUSE_GROUPS[g].ruleset};
}
const FACTION_ORDER = {Alliance: 0, Horde: 1, Blackwater: 2};
let staticReady = null, houses = [];

function loadScript(src){
  return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok;
    s.onerror = () => bad(new Error('Failed to load ' + src)); document.head.appendChild(s); });
}
async function fetchOK(url, opt){ const r = await fetch(url, opt); if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`); return r; }

async function loadHouse(){
  const h = houses.find(h => h.file === $('#house').value) || houses[0];
  const text = await (await fetchOK('data/' + h.file, {cache: 'no-cache'})).text();
  const err = fsaLoadPrices(text); if (err) throw new Error(err);
}

async function staticBoot(){
  $('#status').textContent = 'Loading recipe data and prices…';
  await loadScript('wasm_exec.js');
  const go = new Go();
  const ready = new Promise(r => addEventListener('fsa-ready', r, {once: true}));
  const bytes = await (await fetchOK('app.wasm')).arrayBuffer();
  const { instance } = await WebAssembly.instantiate(bytes, go.importObject);
  go.run(instance); await ready;
  const [recText, hs] = await Promise.all([
    fetchOK(RECIPES_URL).then(r => r.text()),
    fetchOK('data/houses.json', {cache: 'no-cache'}).then(r => r.json())]);
  const err = fsaLoadRecipes(recText); if (err) throw new Error(err);
  houses = (hs.houses || []).map(h => ({...h, ...houseInfo(h)}))
    .sort((a, b) => a.order - b.order || (FACTION_ORDER[a.faction] ?? 9) - (FACTION_ORDER[b.faction] ?? 9));
  if (!houses.length) throw new Error('No auction house data published yet');
  $('#house').innerHTML = houses.map(h => `<option value="${esc(h.file)}">${esc(h.region.toUpperCase())} · ${esc(h.faction)} · ${esc(h.ruleset)}</option>`).join('');
  const def = houses.find(h => h.house === DEFAULT_HOUSE);
  if (def) $('#house').value = def.file;
  const saved = restore().house; if (saved && houses.some(h => h.file === saved)) $('#house').value = saved;
  $('#houseWrap').hidden = false;
  $('#refresh').textContent = 'Reload prices';
  $('#refresh').title = 'Prices are refreshed hourly on the server; this reloads the latest snapshot.';
  await loadHouse();
}

async function api(url, opt){
  if (STATIC){
    await staticReady;
    let j;
    if (url.startsWith('/api/status')) j = JSON.parse(fsaStatus());
    else if (url.startsWith('/api/recommend')) j = JSON.parse(fsaRecommend(url.split('?')[1] || ''));
    else if (url.startsWith('/api/refresh')) { await loadHouse(); j = JSON.parse(fsaStatus()).prices; }
    if (!j) throw new Error('unknown request ' + url);
    if (j.error) throw new Error(j.error);
    return j;
  }
  const r = await fetch(url, opt); const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText); return j;
}

let CUR = null; // {region, house} of the prices on screen
function showStatus(p){
  if (p && p.house) CUR = {region: p.region, house: p.house};
  $('#status').innerHTML = p ? `AH: ${esc(p.source)} · ${p.items.toLocaleString()} items · snapshot ${ago(p.updated)}` : '<span class="err">No AH data</span>';
}

async function init(){
  try{
    if (STATIC) { staticReady = staticBoot(); await staticReady; }
    loadItems(); setupHover();
    const s = await api('/api/status');
    const saved = restore();
    $('#prof').innerHTML = s.professions.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
    if (saved.prof) $('#prof').value = saved.prof;
    if (saved.skill) $('#skill').value = saved.skill;
    if (saved.target) $('#target').value = saved.target;
    if (s.prices) showStatus(s.prices); else $('#status').innerHTML = `<span class="err">${esc(s.pricesError||'No AH data')}</span>`;
  }catch(e){ $('#status').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

// --- Item tooltips (stats from Blizzard's item API, cached in data/items.json)
let ITEMS = {};
async function loadItems(){
  try{ const r = await fetch(STATIC ? 'data/items.json' : '/data/items.json', {cache:'no-cache'}); if (r.ok) ITEMS = await r.json(); }catch(e){}
}
function tipHTML(id){
  const it = ITEMS[id];
  if (!it || !it.lines || !it.lines.length) return '';
  return '<div class="tip">' + it.lines.map(l => {
    const parts = String(l.t).split('\t').map(p => `<span>${esc(p)}</span>`).join('');
    return `<div class="l" style="${l.c ? 'color:'+l.c : ''}">${parts}</div>`;
  }).join('') + '</div>';
}
const itemName = (id, name) => id && ITEMS[id] && ITEMS[id].lines ? `<span class="item" data-item="${id}">${esc(name)}</span>` : esc(name);
const CAN_HOVER = window.matchMedia && matchMedia('(hover: hover)').matches;
function setupHover(){
  if (!CAN_HOVER) return;
  const tip = document.createElement('div'); tip.id = 'tip'; tip.hidden = true; document.body.appendChild(tip);
  document.addEventListener('mouseover', e => {
    const el = e.target.closest && e.target.closest('.item');
    if (!el) { tip.hidden = true; return; }
    const h = tipHTML(el.dataset.item); if (!h) return;
    tip.innerHTML = h; tip.hidden = false;
  });
  document.addEventListener('mousemove', e => {
    if (tip.hidden) return;
    const w = tip.offsetWidth, hgt = tip.offsetHeight;
    let x = e.clientX + 16, y = e.clientY + 16;
    if (x + w > innerWidth - 8) x = e.clientX - w - 16;
    if (y + hgt > innerHeight - 8) y = Math.max(8, innerHeight - hgt - 8);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
}

// --- Price history (recorded hourly by the site's GitHub workflow)
const HIST = {};
function loadHistory(){
  if (!CUR) return Promise.resolve(null);
  const file = `history-${CUR.region}-${CUR.house}.json`;
  if (!HIST[file]) HIST[file] = fetch((STATIC ? 'data/' : '/data/') + file, {cache: 'no-cache'})
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return HIST[file];
}
const fmtTime = t => new Date(t * 1000).toLocaleString([], {month: 'short', day: 'numeric', hour: 'numeric'});
async function renderHistory(el){
  const id = el.dataset.item, h = await loadHistory();
  const col = h && h.i && h.i[id];
  const pts = [];
  if (col) h.t.forEach((t, i) => { if (col[i] > 0) pts.push([t, col[i]]); });
  if (pts.length < 2) {
    el.innerHTML = `<h3>Market price over time</h3><div class="empty">${pts.length ? 'One snapshot so far ('+gold(pts[0][1])+' at '+fmtTime(pts[0][0])+').' : 'No history yet.'} A new point is recorded every hour.</div>`;
    return;
  }
  const W = Math.max(260, Math.min(560, el.clientWidth || 400)), H = 140, L = 64, R = 10, T = 10, B = 22;
  const t0 = pts[0][0], t1 = pts[pts.length-1][0];
  let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
  if (lo === hi) { lo *= 0.9; hi *= 1.1; }
  const pad = (hi - lo) * 0.1; lo = Math.max(0, lo - pad); hi += pad;
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join('');
  const days = Math.max(1, Math.round((t1 - t0) / 86400));
  el.innerHTML = `<h3>Market price over time · ${pts.length} snapshots${(t1-t0) > 86400 ? ', ' + days + ' days' : ''}</h3>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Market price history">
      <line x1="${L}" x2="${W-R}" y1="${y(hi-pad)}" y2="${y(hi-pad)}" stroke="var(--line)" stroke-dasharray="2 3"/>
      <line x1="${L}" x2="${W-R}" y1="${y(lo+pad)}" y2="${y(lo+pad)}" stroke="var(--line)" stroke-dasharray="2 3"/>
      <text x="${L-6}" y="${y(hi-pad)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${gold(hi-pad)}</text>
      <text x="${L-6}" y="${y(lo+pad)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${gold(lo+pad)}</text>
      <text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${fmtTime(t0)}</text>
      <text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtTime(t1)}</text>
      <path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <g class="cross" visibility="hidden">
        <line class="cl" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1"/>
        <circle class="cd" r="4" fill="var(--gold)" stroke="var(--panel)" stroke-width="2"/>
      </g>
      <rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent"/>
    </svg><div class="htip" hidden></div>`;
  const svg = el.querySelector('svg'), cross = svg.querySelector('.cross'), tip = el.querySelector('.htip');
  const move = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    let best = pts[0];
    for (const p of pts) if (Math.abs(x(p[0]) - px) < Math.abs(x(best[0]) - px)) best = p;
    const cx = x(best[0]), cy = y(best[1]);
    cross.setAttribute('visibility', 'visible');
    cross.querySelector('.cl').setAttribute('x1', cx); cross.querySelector('.cl').setAttribute('x2', cx);
    cross.querySelector('.cd').setAttribute('cx', cx); cross.querySelector('.cd').setAttribute('cy', cy);
    tip.hidden = false; tip.textContent = `${fmtTime(best[0])} · ${gold(best[1])}`;
    const left = cx * r.width / W, tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, left - tw / 2), r.width - tw) + 'px';
    tip.style.top = (el.querySelector('h3').offsetHeight + cy * r.height / H - 34) + 'px';
  };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); tip.hidden = true; });
}

function reagentText(o){
  return o.reagents.map(g => `${g.count}× ${itemName(g.item, g.name)} @ ${g.priced? gold(g.unit)+' ('+g.source+')' : '<span class="err">no price</span>'}`).join(' · ');
}

function optionRows(list, cols, id){
  if (!list.length) return `<tr><td colspan="${cols.length}" class="note">Nothing here with these settings.</td></tr>`;
  return list.slice(0, 25).map((o,i) => `
    <tr class="click" data-t="${id}-${i}">${cols.map(c => c.f(o)).join('')}</tr>
    <tr class="detail" id="${id}-${i}" hidden><td colspan="${cols.length}"><div class="detail-wrap">
      ${tipHTML(o.item)}<div>
      <b>Reagents:</b> ${reagentText(o) || 'none'}<br>
      Learn at ${o.required} · source: ${esc(o.sources)}${o.ahUnit? ' · AH price '+gold(o.ahUnit)+' each, '+o.listed+' listed' : ''}${o.soldPerDay!=null? ' · ~'+o.soldPerDay.toFixed(1)+' sold/day':''}
    </div>${o.item ? `<div class="hist" data-item="${o.item}"></div>` : ''}</div></td></tr>`).join('');
}

const td = (v, cls='') => `<td class="${cls}">${v}</td>`;
const colCol = o => td(`${o.colour}`, 'c-'+o.colour);
const saleCell = o => td(o.saleHow==='none' ? '—' : gold(o.sale) + (o.saleHow==='vendor'?' <span class="status">vendor</span>':''), 'num');

function render(d){
  const rec = d.recommendation, plan = d.plan;
  for (const k of ['skillUps','profit','unpriced']) rec[k] = rec[k] || [];
  plan.steps = plan.steps || []; plan.shopping = plan.shopping || [];
  for (const o of [...rec.skillUps, ...rec.profit, ...rec.unpriced, ...plan.steps.map(s=>s.option)]) o.reagents = o.reagents || [];
  const skillCols = [
    {h:'Recipe', f:o=>td(itemName(o.item, o.name))}, {h:'Colour', f:colCol},
    {h:'Chance', f:o=>td(pct(o.chance),'num')}, {h:'Mats', f:o=>td(gold(o.cost),'num')},
    {h:'Sells for', f:saleCell}, {h:'Profit', f:o=>td(signed(o.profit),'num')},
    {h:'Net / point', f:o=>td(signed(-o.costPerPoint),'num')}];
  const profitCols = [
    {h:'Recipe', f:o=>td(itemName(o.item, o.name))}, {h:'Colour', f:colCol},
    {h:'Mats', f:o=>td(gold(o.cost),'num')}, {h:'Sells for', f:saleCell},
    {h:'Profit', f:o=>td(signed(o.profit),'num')}, {h:'Listed', f:o=>td(o.listed,'num')}];
  const head = cols => '<tr>'+cols.map(c=>`<th class="${c.h==='Recipe'||c.h==='Colour'?'':'num'}">${c.h}</th>`).join('')+'</tr>';

  let planRows = plan.steps.map(s => `
    <tr><td>${s.from}–${s.to}</td><td>${itemName(s.option.item, s.option.name)}</td><td class="c-${s.option.colour}">${s.option.colour}</td>
    <td class="num">${s.crafts}</td><td class="num">${gold(s.cost)}</td><td class="num">${gold(s.sale)}</td><td class="num">${signed(s.net)}</td></tr>
    ${s.trainNote||s.warnings? `<tr class="detail"><td></td><td colspan="6">${s.trainNote? '↳ '+esc(s.trainNote)+' ':''}${(s.warnings||[]).map(w=>`<span class="warn">⚠ ${esc(w)}</span>`).join(' ')}</td></tr>`:''}`).join('');
  if (!plan.steps.length) planRows = `<tr><td colspan="7" class="note">No plan possible.</td></tr>`;

  $('#out').innerHTML = `
  <div class="grid">
    <div class="panel"><h2>Best skill-ups at ${rec.skill}</h2>
      <div class="scroll"><table>${head(skillCols)}${optionRows(rec.skillUps, skillCols, 's')}</table></div>
      <div class="note">Ranked by net gold per skill point (green = you make money while leveling; lower-chance crafts are used only when nothing better is available). Click a row for reagents.</div>
    </div>
    <div class="panel"><h2>Most profitable crafts at ${rec.skill}</h2>
      <div class="scroll"><table>${head(profitCols)}${optionRows(rec.profit, profitCols, 'p')}</table></div>
      <div class="note">Any colour, sold on the AH after its 5% cut. Check “Listed” before crafting a stack.</div>
    </div>
  </div>
  <div class="panel"><h2>Leveling plan ${plan.from} → ${plan.to}</h2>
    <div class="scroll"><table><tr><th>Skill</th><th>Craft</th><th>Colour</th><th class="num">Crafts</th><th class="num">Mats</th><th class="num">Sell back</th><th class="num">Net</th></tr>${planRows}</table></div>
    ${plan.stuckAt? `<div class="warn">Stopped at ${plan.stuckAt}: no priced recipe gives a skill-up there. Try allowing more recipe sources.</div>`:''}
    <div class="totals"><span>Materials: <b>${gold(plan.cost)}</b></span><span>Sell back: <b>${gold(plan.sale)}</b></span><span>Net: <b>${signed(plan.net)}</b></span></div>
    ${plan.shopping && plan.shopping.length ? `<h2 style="margin-top:16px">Shopping list</h2><div class="scroll"><table>
      <tr><th class="num">Qty</th><th>Item</th><th class="num">Each</th><th>From</th><th class="num">Total</th></tr>
      ${plan.shopping.map(l=>`<tr><td class="num">${l.count}</td><td>${itemName(l.item, l.name)}</td><td class="num">${gold(l.unit)}</td><td>${l.source}</td><td class="num">${gold(l.total)}</td></tr>`).join('')}
    </table></div>`:''}
    <div class="note">Crafts are expected counts: orange always skills up, then the chance falls through yellow and green, (grey − skill) / (grey − yellow). Reagents count at the cheapest of AH market price, vendor price, or crafting them yourself. AH deposits aren't included.</div>
  </div>
  ${rec.unpriced && rec.unpriced.length ? `<div class="note">${rec.unpriced.length} skill-up recipes skipped (a reagent has no AH or vendor price): ${rec.unpriced.slice(0,12).map(o=>esc(o.name)).join(', ')}${rec.unpriced.length>12?'…':''}</div>`:''}`;

  document.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => {
    const d = document.getElementById(tr.dataset.t); d.hidden = !d.hidden;
    if (d.hidden) return;
    const sc = d.closest('.scroll'), wrap = d.querySelector('.detail-wrap');
    if (sc && wrap) wrap.style.maxWidth = (sc.clientWidth - 24) + 'px';
    d.querySelectorAll('.hist').forEach(renderHistory);
  });
}

async function recommend(e){
  e && e.preventDefault(); save();
  const btn = $('#f button[type=submit]'); btn.disabled = true;
  const src = [...document.querySelectorAll('[data-src]')].filter(c=>c.checked).map(c=>c.dataset.src).join('');
  const qs = new URLSearchParams({prof:$('#prof').value, skill:$('#skill').value, target:$('#target').value, sources: src || '-', cooldowns: $('#cooldowns').checked?'1':'0'});
  $('#out').innerHTML = '<div class="panel note">Crunching recipes…</div>';
  try{ const d = await api('/api/recommend?'+qs); showStatus(d.prices); render(d); }
  catch(err){ $('#out').innerHTML = `<div class="panel err">${esc(err.message)}</div>`; }
  finally{ btn.disabled = false; }
}

$('#f').addEventListener('submit', recommend);
$('#skill').addEventListener('change', () => { const s=+$('#skill').value; if (+$('#target').value <= s) $('#target').value = Math.min(300, s+25); });
$('#refresh').addEventListener('click', async () => {
  const b = $('#refresh'); b.disabled = true; b.textContent = 'Fetching…';
  try{ showStatus(await api('/api/refresh', {method:'POST'})); if ($('#out').innerHTML) recommend(); }
  catch(e){ $('#status').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  finally{ b.disabled = false; b.textContent = STATIC ? 'Reload prices' : 'Refresh AH prices'; }
});
$('#house').addEventListener('change', async () => {
  save();
  try{ await loadHouse(); showStatus(JSON.parse(fsaStatus()).prices); if ($('#out').innerHTML) recommend(); }
  catch(e){ $('#status').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
});
init();
</script>
</body>
</html>
